name: terraform destroy dev network

# ONE UNIT, deliberately. Everything composed by stacks/network is recorded in
# this unit's state and is destroyed with it, including modules added later.
# A future live/dev/<stack>/terragrunt.hcl is a separate unit with separate
# state and must be added here explicitly, in reverse dependency order. Do not
# replace this with `run --all` from live/: that scope also contains stage and
# prod.
on:
  # GitHub schedules use UTC. 18:30 UTC is midnight in Asia/Colombo.
  schedule:
    - cron: '30 18 * * *'
  # The manual trigger is the check before relying on the first scheduled run.
  workflow_dispatch:

# Apply and destroy operate on the same state. Sharing the group queues one
# behind the other instead of making the state lock resolve the race later.
concurrency:
  group: terraform-apply-dev-network
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.14.6
  TF_IN_AUTOMATION: "true"
  TG_VERSION: 1.1.4
  TG_SHA256: a2640da8455fa5f3671167e6373832b0907b9dc972dd01c2093cc7808934e158
  TG_TF_PATH: terraform
  UNIT: live/dev/network

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest

    # This both selects the environment-scoped role variable and makes GitHub
    # mint an OIDC subject ending in :environment:dev. The dev environment has
    # no required reviewer, so a scheduled run does not wait for a person.
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # This binary runs with the apply role's credentials, so it is pinned by
      # both version and checksum rather than trusting a moving release tag.
      - name: install terragrunt
        run: |
          set -eu
          url="https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          curl -sSLo /tmp/terragrunt "$url"
          echo "${TG_SHA256}  /tmp/terragrunt" | sha256sum -c -
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: assume the dev apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: linkforge-destroy-dev-${{ github.run_id }}

      - name: whoami
        run: aws sts get-caller-identity

      - name: init
        working-directory: ${{ env.UNIT }}
        run: terragrunt run -- init -input=false -lock-timeout=5m

      # A saved destroy plan is the non-interactive approval. It keeps the
      # target reviewable and avoids `destroy -auto-approve`. The absolute path
      # is required because Terraform runs inside Terragrunt's cache.
      - name: create destroy plan
        working-directory: ${{ env.UNIT }}
        run: terragrunt run -- plan -destroy -out=${{ github.workspace }}/destroy.tfplan -input=false -no-color -lock-timeout=5m

      - name: render the destroy plan into the run summary
        working-directory: ${{ env.UNIT }}
        run: |
          {
            echo '## Destroy `${{ env.UNIT }}`'
            echo '```terraform'
            terragrunt run -- show -no-color ${{ github.workspace }}/destroy.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: apply destroy plan
        working-directory: ${{ env.UNIT }}
        run: terragrunt run -- apply -input=false -no-color -lock-timeout=5m ${{ github.workspace }}/destroy.tfplan
